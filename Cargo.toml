[package]
name = "tilezone"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
egui_glass = { path = "vendor/egui_glass" }
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal"] }
sysinfo = "0.40.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = { version = "0.13", features = ["xinput"] }
