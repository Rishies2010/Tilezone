[package]
name = "glass_spike"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.37"
egui_glass = "0.2.0"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sysinfo = "0.40.3"